<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task 3 — Café table reservation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container py-4 py-lg-5">
      <header class="page-heading mb-4">
        <span class="eyebrow">CAFÉ RESERVATIONS</span>
        <h1>Reserve a table</h1>
        <p>Tell us a little about your visit.</p>
      </header>
      <section class="ticket-card mx-auto" style="max-width: 800px">
        <div class="ticket-card-head">
          <div>
            <span class="eyebrow text-light">YOUR VISIT</span>
            <h2>We’ll save you a seat</h2>
          </div>
          <span class="train-icon" aria-hidden="true">♡</span>
        </div>
        <form action="#" method="get">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="guest-name" class="form-label"
                >Your name <span class="required-mark">*</span></label
              ><input
                class="form-control"
                type="text"
                id="guest-name"
                name="guest-name"
                autocomplete="name"
                required
              />
            </div>
            <div class="col-12 col-md-6">
              <label for="guest-email" class="form-label"
                >Email <span class="required-mark">*</span></label
              ><input
                class="form-control"
                type="email"
                id="guest-email"
                name="guest-email"
                autocomplete="email"
                required
              />
            </div>
            <div class="col-12 col-md-6">
              <label for="phone" class="form-label">Phone</label
              ><input
                class="form-control"
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
              />
            </div>
            <div class="col-12 col-md-6">
              <label for="people" class="form-label"
                >Guests <span class="required-mark">*</span></label
              ><input
                class="form-control"
                type="number"
                id="people"
                name="people"
                min="1"
                max="20"
                step="1"
                value="2"
                required
              />
            </div>
            <div class="col-12 col-md-6">
              <label for="date" class="form-label"
                >Date <span class="required-mark">*</span></label
              ><input
                class="form-control"
                type="date"
                id="date"
                name="date"
                required
              />
            </div>
            <fieldset class="col-12 col-md-6">
              <legend class="form-label">Seating preference</legend>
              <div class="d-flex gap-3 flex-wrap">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="seating"
                    id="inside"
                    value="inside"
                    checked
                  /><label class="form-check-label" for="inside">Inside</label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="seating"
                    id="terrace"
                    value="terrace"
                  /><label class="form-check-label" for="terrace"
                    >Terrace</label
                  >
                </div>
              </div>
            </fieldset>
            <div class="col-12">
              <label for="meal" class="form-label">Preferred meal time</label
              ><select class="form-select" id="meal" name="meal">
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
              </select>
            </div>
            <div class="col-12">
              <label for="comments" class="form-label"
                >Comments (optional)</label
              ><textarea
                class="form-control"
                id="comments"
                name="comments"
                rows="3"
                placeholder="Allergies, accessibility needs, or special requests"
              ></textarea>
            </div>
            <div class="col-12">
              <div class="form-check agreement">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="terms"
                  name="terms"
                  required
                /><label class="form-check-label" for="terms"
                  >I agree to the reservation terms.
                  <span class="required-mark">*</span></label
                >
              </div>
            </div>
            <div class="col-12 d-grid">
              <button type="submit" class="btn btn-find">
                Reserve table <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
